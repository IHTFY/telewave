<!doctype html>

<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<title>Telewave</title>
		<meta name="description" content="Telewave: an online take on the Wavelength party game">
		<meta name="author" content="Frankie">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Karla:wght@400;600;700&display=swap">
		<link rel="stylesheet" href="styles/styles.css?v=2.0">

		<!-- Google Auto Ads -->
		<script
			async
			src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7816252471679024"
			crossorigin="anonymous"
		></script>
	</head>

	<body>
		<div class="wrap">
			<header id="header">
				<h1>Telewave</h1>
				<nav class="menu">
					<button type="button" id="newGame" class="link-btn">
						<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 4a8 8 0 1 1-7.75 10h2.07A6 6 0 1 0 12 6v3L7.5 5 12 1v3Z" fill="currentColor"/></svg>
						<span class="menu-text">New game</span>
					</button>
					<a href="instructions" class="link-btn">
						<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm0 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16Zm-1 11h2v2h-2v-2Zm1-8a3.5 3.5 0 0 1 1.7 6.56c-.47.27-.7.52-.7.94V14h-2v-.5c0-1.3.74-2 1.7-2.56A1.5 1.5 0 1 0 10.5 9.5h-2A3.5 3.5 0 0 1 12 7Z" fill="currentColor"/></svg>
						<span class="menu-text">Instructions</span>
					</a>
					<button type="button" id="seedToggle" class="link-btn" aria-expanded="false" aria-controls="seedBox" title="Play on several devices with a shared seed">
						<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7a5 5 0 0 0 0 10h4v-1.9H7A3.1 3.1 0 0 1 3.9 12ZM8 13h8v-2H8v2Zm9-6h-4v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10Z" fill="currentColor"/></svg>
						<span class="menu-text">Seed</span>
					</button>
				</nav>
				<div class="seed-container" id="seedBox" hidden>
					<label for="seed" class="label">Seed</label>
					<input type="text" id="seed" placeholder="any word" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
					<label for="cardNo" class="label card-label" title="Card number: keep this the same on every device">#</label>
					<input type="number" id="cardNo" min="1" step="1" inputmode="numeric" aria-label="Card number" enterkeyhint="done">
					<button type="button" id="copySeed" class="icon-btn" aria-label="Copy link with this seed and card" title="Copy link with this seed and card">
						<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 3h9a2 2 0 0 1 2 2v11h-2V5H9V3Zm-4 4h9a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Zm0 2v11h9V9H5Z" fill="currentColor"/></svg>
					</button>
				</div>
			</header>

			<section class="board" aria-label="Game board">
				<div class="track" id="track0"></div>

				<div class="center">
					<button type="button" id="turn" class="turn" aria-live="polite" title="Click to switch turns">
						<span class="turn-dot" aria-hidden="true"></span>
						<span id="turnText">Team 1's turn</span>
					</button>

					<svg class="dial" id="dial" viewBox="0 0 760 420" role="slider" tabindex="0"
						aria-label="Guess dial" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
						<defs>
							<pattern id="speck" patternUnits="userSpaceOnUse" width="220" height="220">
								<image id="speckImg" width="220" height="220"/>
							</pattern>
							<clipPath id="upper"><rect x="0" y="0" width="760" height="330"/></clipPath>
							<clipPath id="faceClip"><path id="faceClipPath"/></clipPath>
						</defs>
						<g id="scallops"></g>
						<path id="casing" class="navy"/>
						<path id="casingSpeck" fill="url(#speck)"/>
						<path id="face" class="face"/>
						<g clip-path="url(#faceClip)"><g id="target"></g><g id="ticks"></g></g>
						<g clip-path="url(#upper)"><path id="shade" class="shade"/></g>
						<path id="panel" class="navy"/>
						<path id="panelSpeck" fill="url(#speck)"/>
						<rect id="stopL" class="mint" rx="7"/>
						<g id="handle"><rect id="handleBar" class="mint" rx="9"/><rect id="handleHit" fill="transparent"/></g>
						<g id="needle">
							<line id="guessLine" class="needle-line"/>
							<circle id="hubRing" class="hub-ring" r="46"/>
							<circle id="hub" class="hub" r="34"/>
						</g>
					</svg>

					<div class="cardrow">
						<button type="button" class="gemslot" id="gemL" aria-pressed="false" aria-label="Other team bets the target is LEFT of the needle"></button>
						<div class="card" id="card">
							<div class="side" id="side1"><span class="arrow" aria-hidden="true">&#10229;</span><span class="word" id="word1"></span></div>
							<div class="side" id="side2"><span class="arrow" aria-hidden="true">&#10230;</span><span class="word" id="word2"></span></div>
						</div>
						<button type="button" class="gemslot" id="gemR" aria-pressed="false" aria-label="Other team bets the target is RIGHT of the needle"></button>
					</div>

					<div class="controls">
						<button type="button" class="ctl" id="new">New card</button>
						<button type="button" class="ctl peek" id="reveal">Hold to peek</button>
						<button type="button" class="ctl primary" id="commit">Guess</button>
						<button type="button" class="ctl" id="reset">Clear</button>
					</div>
					<div class="readout-row">
						<output class="readout" id="guessdisp" for="dial">50%</output>
						<label class="switch" for="percentages" title="Show the needle position as a percentage">
							<input type="checkbox" id="percentages" role="switch" checked aria-label="Show percentage">
							<span class="switch-track" aria-hidden="true"><span class="switch-knob">%</span></span>
						</label>
					</div>
					<div class="status" id="score" aria-live="polite"></div>
				</div>

				<div class="track" id="track1"></div>
			</section>
			<div class="stripes" aria-hidden="true"></div>
		</div>

		<script src="scripts/seedrandom.js"></script>
		<script src="scripts/data.js"></script>
		<script src="scripts/board.js"></script>
	</body>
</html>
